<style xmlns="http://www.w3.org/1999/html">
    .sidebar{
        display:flex;
        max-height:100vh;
        width:200px;
        background: #f4f4f4;
        flex-direction: column;
        position:sticky;
        top:0;
        left:0;
        border-right: 1px solid #ddd;
        overflow: unset;
        transition: width 0.3s ease;
    }
    .sidebar header{
        position:sticky;
        border-bottom: 1px solid #eee;  }
        .sidebar.collapsed {
            width: 60px;
        }
        .sidebar header, .sidebar img{
            text-align: center;
            padding: 10px;
        }
        .sidebar img {
  			width: 60%;
  			height: 40px;
  			display:flex;
  			border-bottom: 1px solid #eee;
  			shrink:0;
  			padding:5px;
  			margin:auto;
		}
        .sidebar a{
            display: flex;
            color: Black;
            text-decoration: none;
            padding: 10px;
            border-bottom: px solid #eee;
            transition: 0.3s;
            white-space: nowrap;
            align-items: center;
        }
        .sidebar a .active-page{
            background-color:white;
        }
        .sidebar a i {
            font-size: 18px;
            min-width: 40px;
            text-align: center;
        }
        .sidebar.collapsed a span {
            display: none;
        }
        .fa-solid fa-bars {
            position: absolute;
            left: 250px;
            top: 20px;
            cursor: pointer;
            font-size: 20px;
            transition: left 0.3s ease;
        }
        .sidebar.collapsed + .fa-solid fa-bars {
            left: 70px;
        }
        .sidebar.collapsed ~ .main-content {
            margin-left: 0px;
            cursor:pointer;
        }

        .sidebar.collapsed img{
            width: 80%;
  			height: 30px;
  			display:flex;
  			border-bottom: 1px solid #eee;
  			shrink:0;
  			padding:5px;
  			margin:auto;
        }
    .dropdown {
        display: flex;
        flex-direction: column;
        background: #f4f4f4;
        justify-content: center;
        cursor:pointer;
    }
    .dropdown a {
        padding: 8px 10px;
        font-size: 14px;
        border-bottom: none;
        margin-left:30px;
    }
    .dropdown-btn {
        display: flex;
        justify-content: space-between;
        cursor: pointer;
    }
    .dropdown-btn i.arrow {
        transition: transform 0.3s ease;
    }
    .sidebar.collapsed .dropdown {
        display: none;
    }
</style>

    //Function for Dropdown
    function toggleDropdown(id) {
            const dropdown = document.getElementById(id);
            const arrow = dropdown.previousElementSibling.querySelector(".arrow");
            if (!dropdowns.includes(dropdown)) {
        dropdowns.push(dropdown);
    }
            dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
            arrow.classList.toggle("active");
        }
    function closeAllDropdowns() {
    dropdowns.forEach(dropdown => {
        dropdown.style.display = "none";
        const arrow = dropdown.previousElementSibling.querySelector(".arrow");
        if (arrow) {
            arrow.classList.remove("active");
        }
    });
}document.addEventListener('DOMContentLoaded', () => {
    const sidebar = document.getElementById("mySidebar");
    sidebarState = !sidebar.classList.contains("collapsed");

    // Close dropdowns on page load if sidebar is collapsed
    if (!sidebarState) {
        closeAllDropdowns();
    }
});
