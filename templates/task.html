{% extends 'base.html' %}
{% block content %}
<style>
#customers {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

#customers td, #customers th {
  border: 1px solid #ddd;
  padding: 8px;
}

#customers tr:nth-child(even){background-color: #f2f2f2;}

#customers tr:hover {background-color: #ddd;}

#customers th {
  padding-top: 12px;
  padding-bottom: 12px;
  text-align: left;
  background-color: lightgray;
  color: black;
}
</style>


<div style="padding: 20px; background-color: #f5f5f5;max-height:90vh;overflow-y:auto;">
  <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px ;gap:15px;
                    margin-top:10px;margin-right:10px;margin-left:10px;">
      <div>
          <h3 style="0 0 20px 0; font-size: 18px;">Tasks</h3>
      </div>
      <div style="display:flex;justify-content: space-between;">
          <div STYLE="display:flex; justify-content:400px;gap:20px;">
              <div>
                  <select id="rows">
                      <option value="5" selected>5</option>
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50" >50</option>
                      <option value="100">100</option>
                  </select>
              </div>
              <div>
                  <i class="fa-solid fa-eye-slash"></i>
              </div>
          </div>
          <div>
              <select id="priority_rows"style="height: 30px;">
                  <option value="5" selected>-Priority-</option>
                  <option value="10">10</option>
                  <option value="25">25</option>
                  <option value="50" >50</option>
                  <option value="100">100</option>
              </select>
              <select id="milestone_rows"style="height: 30px;">
                  <option value="5" selected>-Milestone-</option>
                  <option value="10">10</option>
                  <option value="25">25</option>
                  <option value="50" >50</option>
                  <option value="100">100</option>
              </select>
              <select id="team_rows"style="height: 30px;">
                  <option value="5" selected>-Team Members-</option>
                  <option value="10">10</option>
                  <option value="25">25</option>
                  <option value="50" >50</option>
                  <option value="100">100</option>
              </select>
              <select id="deadline_rows"style="height: 30px;">
                  <option value="5" selected>-Deadline-</option>
                  <option value="10">10</option>
                  <option value="25">25</option>
                  <option value="50" >50</option>
                  <option value="100">100</option>
              </select>
              <select id="status_rows"style="height: 30px;">
                  <option value="5" selected>-Status-</option>
                  <option value="10">10</option>
                  <option value="25">25</option>
                  <option value="50" >50</option>
                  <option value="100">100</option>
              </select>
              <button style=" color: black; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;height: 30px;">
                  <i class="fa-solid fa-file-excel"></i>
                  Excel
              </button>
              <button style=" color: black; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;height: 30px;">
                  <i class="fa-solid fa-print"></i>
                  Print
              </button>
              <button style=" color: black; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;height: 30px;">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  Search
              </button>
          </div>
      </div>
      <div style="margin-left:950px;margin-top:20px;">
          <select id="filters_rows"style="height: 30px;">
              <option value="5" selected>-Quick Filters-</option>
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50" >50</option>
              <option value="100">100</option>
          </select>
          <select id="project_rows"style="height: 30px;">
              <option value="5" selected>-Project-</option>
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50" >50</option>
              <option value="100">100</option>
          </select>
      </div>


            <div style="margin-top:20px;">
                <table id="customers">
                    <tr style="height:70px;">
                      <th>ID</th>
                      <th>Title</th>
                      <th>Start Date</th>
                      <th>Deadline</th>
                      <th>Milestone</th>
                      <th>Project</th>
                      <th>Assigned to</th>
                      <th>Collaborators</th>
                      <th>Status</th>
                      <th>Approx Hours</th>
                    </tr>
                </table>
            </div>
      <div style="padding:30px;text-align:center;">
          No Record Found
      </div>
  </div>
</div>

{% endblock %}
