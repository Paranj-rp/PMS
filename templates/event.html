{% extends 'base.html' %}

{% block extra_style %}
    .innertube {
			margin-top: 0;
            flex-grow:1;
            display: flex;
            flex-direction: column;
            width:98%;
            padding:10px;
        }
{% endblock %}

{% block content %}
<div style=" padding: 20px; background-color: #f5f5f5;max-height:100vh;overflow-y:auto;">
        <!-- Notes Overview -->
        <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px ;height:500px;gap:15px;
                    margin-top:10px;margin-right:10px;margin-left:10px;">
            <div style="display:flex;justify-content: space-between;">
                <div>
                    <h3 style="0 0 20px 0; font-size: 18px;">Event Calendar</h3>
                </div>
                <div>
                    <select id="event_status" style="height: 30px;">
                        <option value="5" selected>Event Status</option>
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50" >50</option>
                        <option value="100">100</option>
                    </select>
                    <select id="event_type" style="height: 30px;">
                        <option value="5" selected>Event Type</option>
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50" >50</option>
                        <option value="100">100</option>
                    </select>

                    <button style=" color: black; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                        <i class="fa-solid fa-tag"></i>
                        Manage Labels
                    </button>
                    <button style=" color: black; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; background:lightblue">
                        <i class="fa-solid fa-plus"></i>
                        Add Note
                    </button>
                </div>
            </div>
            <div style="display:flex;justify-content: space-between;">
                <div STYLE="display:flex; justify-content:400px;">
                    <div>
                        <button>
                            <i class="fa-solid fa-angle-left"></i>
                        </button>
                        <button>
                            <i class="fa-solid fa-angle-right"></i>
                        </button>
                    </div>
                    <div>
                        <button>
                            Today
                        </button>
                    </div>
                </div>
                <div>
                    <button style=" color: black; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Search
                    </button>
                </div>
            </div>
        </div>
</div>
{% endblock %}
